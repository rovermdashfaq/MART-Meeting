<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ProMeet — Room</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="center">
    <header style="display:flex;align-items:center;justify-content:space-between;gap:12px; margin-bottom:8px">
      <h1>ProMeet</h1>
      <div class="small">Secure 1-on-1 meetings • PeerJS</div>
    </header>

    <div class="container">
      <section class="left">
        <div class="room-meta">
          <div>Room: <span id="roomIdOut" class="room-id"></span></div>
          <div class="small">You are: <span id="roleOut" style="font-weight:700"></span></div>
        </div>

        <div class="video-row">
          <div style="flex:1; min-width:240px">
            <div class="small">You</div>
            <video id="localVideo" autoplay muted playsinline></video>
          </div>
          <div style="flex:1; min-width:240px">
            <div class="small">Peer</div>
            <video id="remoteVideo" autoplay playsinline></video>
          </div>
        </div>

        <div class="controls-row">
          <button id="toggleAudio" class="icon-btn">Mute</button>
          <button id="toggleVideo" class="icon-btn">Stop Camera</button>
          <button id="shareScreen" class="icon-btn">Share Screen</button>
          <button id="copyLink" class="icon-btn">Copy Link</button>
          <button id="leaveBtn" class="icon-btn leave">Leave</button>
        </div>

        <div style="margin-top:10px" id="statusArea" class="small">Status: <span id="statusText">Initializing…</span></div>

      </section>

      <aside class="right">
        <div class="participants small">Participants: <span id="participantsCount">1</span></div>

        <div class="chat">
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-input">
            <input id="msgInput" placeholder="Type a message..." />
            <button id="sendMsg" class="icon-btn">Send</button>
          </div>
        </div>

        <div style="margin-top:12px;">
          <div class="small">Logs</div>
          <pre id="logs" class="logs"></pre>
        </div>
      </aside>
    </div>
  </main>

  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <script>
  // ---------- CONFIG ----------
  // PeerJS creates a peer on the free PeerServer cloud by default when
  // you instantiate with new Peer(). That's used here.
  // If you want to use your own PeerServer later, you'll pass config into new Peer(id, {host, port, path}) etc.

  // ---------- UI ----------
  const localVideo = document.getElementById('localVideo');
  const remoteVideo = document.getElementById('remoteVideo');
  const roomIdOut = document.getElementById('roomIdOut');
  const roleOut = document.getElementById('roleOut');
  const statusText = document.getElementById('statusText');
  const participantsCount = document.getElementById('participantsCount');
  const logs = document.getElementById('logs');
  const chatMessages = document.getElementById('chatMessages');
  const msgInput = document.getElementById('msgInput');

  const toggleAudioBtn = document.getElementById('toggleAudio');
  const toggleVideoBtn = document.getElementById('toggleVideo');
  const shareScreenBtn = document.getElementById('shareScreen');
  const copyLinkBtn = document.getElementById('copyLink');
  const leaveBtn = document.getElementById('leaveBtn');
  const sendMsgBtn = document.getElementById('sendMsg');

  // ---------- STATE ----------
  const params = new URLSearchParams(location.search);
  const roomId = (params.get('room') || '').trim();
  const role = (params.get('role') === 'host') ? 'host' : 'guest';
  if (!roomId) {
    alert('Missing room id. Go to index page and create a room.');
    location.href = 'index.html';
  }

  roomIdOut.textContent = roomId;
  roleOut.textContent = role;
  let localStream = null;
  let screenStream = null;
  let peer = null;
  let currentCall = null;
  let dataConn = null;
  let participants = new Set();

  // Logging helper
  function log(...a) {
    console.log(...a);
    logs.textContent += a.map(x => (typeof x==='object'?JSON.stringify(x):String(x))).join(' ') + '\n';
    logs.scrollTop = logs.scrollHeight;
  }

  function setStatus(s) {
    statusText.textContent = s;
    log('[status]', s);
  }

  // ---------- Start local media ----------
  async function startLocalMedia() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      localVideo.srcObject = localStream;
      setStatus('Local media ready');
    } catch (err) {
      setStatus('Could not get local media: ' + (err.message || err));
      throw err;
    }
  }

  // ---------- Initialize PeerJS ----------
  function initPeer() {
    setStatus('Initializing PeerJS...');
    // host: use roomId as our peer id so others can call it directly
    const peerId = (role === 'host') ? roomId : undefined; // undefined => server chooses id
    peer = new Peer(peerId);

    peer.on('open', id => {
      log('Peer open:', id);
      setStatus('Connected to signaling server. Peer ID: ' + id);
      participants.add(id);
      updateParticipants();
      if (role === 'guest') {
        // connect to host (call)
        setTimeout(() => callHost(), 500);
      }
    });

    peer.on('error', err => {
      log('Peer error', err);
      setStatus('Peer error: ' + err);
      alert('PeerJS error: ' + err);
    });

    // When someone calls us (incoming media call)
    peer.on('call', call => {
      log('Incoming call from', call.peer);
      // answer with our stream
      call.answer(localStream);
      attachCallHandlers(call);
    });

    // incoming data connection
    peer.on('connection', conn => {
      log('Incoming data connection from', conn.peer);
      setupDataConn(conn);
    });
  }

  // ---------- Call host (for guests) ----------
  function callHost() {
    if (!peer) return;
    setStatus('Calling host: ' + roomId + ' ...');
    const call = peer.call(roomId, localStream);
    attachCallHandlers(call);

    // establish data channel to host for chat
    const conn = peer.connect(roomId);
    conn.on('open', () => {
      log('Data connection open to host');
      setupDataConn(conn);
      // announce ourselves
      conn.send({ type:'hello', from: peer.id || 'guest' });
    });
    conn.on('error', e => log('Data conn error', e));
  }

  // ---------- Attach call handlers ----------
  function attachCallHandlers(call) {
    // hang-up previous
    if (currentCall && currentCall.peer !== call.peer) {
      try { currentCall.close(); } catch(e){}
    }
    currentCall = call;

    // when remote stream arrives
    call.on('stream', remoteStream => {
      log('Remote stream from', call.peer);
      remoteVideo.srcObject = remoteStream;
      setStatus('Connected with ' + call.peer);
      participants.add(call.peer);
      updateParticipants();
    });

    call.on('close', () => {
      log('Call closed by', call.peer);
      setStatus('Call ended by ' + call.peer);
      participants.delete(call.peer);
      updateParticipants();
      remoteVideo.srcObject = null;
    });

    call.on('error', err => {
      log('Call error', err);
      setStatus('Call error: ' + err);
    });
  }

  // ---------- Data channel (chat & presence) ----------
  function setupDataConn(conn) {
    dataConn = conn;
    conn.on('data', data => {
      log('Data received', data);
      if (data && data.type === 'chat') {
        addChatMessage(data.from || 'peer', data.text);
      } else if (data && data.type === 'hello') {
        participants.add(data.from || conn.peer);
        updateParticipants();
      }
    });
    conn.on('close', () => {
      log('Data connection closed', conn.peer);
      participants.delete(conn.peer);
      updateParticipants();
    });
  }

  // ---------- Chat UI ----------
  function addChatMessage(from, text) {
    const el = document.createElement('div');
    el.className = 'msg';
    const time = new Date().toLocaleTimeString();
    el.innerHTML = `<b>${escapeHtml(from)}</b>: ${escapeHtml(text)} <span class="small" style="color:var(--muted)">(${time})</span>`;
    chatMessages.appendChild(el);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>'&#'+c.charCodeAt(0)+';'); }

  sendMsgBtn.onclick = () => {
    const text = (msgInput.value||'').trim();
    if (!text) return;
    addChatMessage('You', text);
    // send via data conn if available; if host, send to guest via last call.peer data connection
    if (dataConn && dataConn.open) {
      dataConn.send({ type:'chat', from: peer.id || 'me', text });
    } else {
      // If host and guest connected through another data channel, try to use call.peer -> connect
      if (role === 'host' && currentCall) {
        try {
          const connToGuest = peer.connect(currentCall.peer);
          connToGuest.on('open', () => connToGuest.send({ type:'chat', from: peer.id, text }));
        } catch(e){ log('send fallback failed', e); }
      }
    }
    msgInput.value = '';
  };
  msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsgBtn.click(); });

  // ---------- Participants UI ----------
  function updateParticipants() {
    participantsCount.textContent = participants.size;
  }

  // ---------- Controls: mute / camera / screen share ----------
  toggleAudioBtn.onclick = () => {
    if (!localStream) return;
    const t = localStream.getAudioTracks()[0];
    if (!t) return;
    t.enabled = !t.enabled;
    toggleAudioBtn.textContent = t.enabled ? 'Mute' : 'Unmute';
  };

  toggleVideoBtn.onclick = () => {
    if (!localStream) return;
    const t = localStream.getVideoTracks()[0];
    if (!t) return;
    t.enabled = !t.enabled;
    toggleVideoBtn.textContent = t.enabled ? 'Stop Camera' : 'Start Camera';
  };

  shareScreenBtn.onclick = async () => {
    if (screenStream) {
      // stop screen sharing and restore camera
      screenStream.getTracks().forEach(t => t.stop());
      screenStream = null;
      // replace track back to camera if peer sender exists
      replaceVideoTrack(localStream.getVideoTracks()[0]);
      shareScreenBtn.textContent = 'Share Screen';
      return;
    }
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const screenTrack = screenStream.getVideoTracks()[0];
      replaceVideoTrack(screenTrack);
      shareScreenBtn.textContent = 'Stop Sharing';
      // when user stops via browser UI
      screenTrack.onended = () => {
        if (localStream) replaceVideoTrack(localStream.getVideoTracks()[0]);
        screenStream = null;
        shareScreenBtn.textContent = 'Share Screen';
      };
    } catch (e) {
      alert('Screen share failed: ' + e.message);
      log('Screen share error', e);
    }
  };

  // replace outgoing video track (PeerJS abstracts senders; but we can ask for existing call and replace using RTCRtpSender where available)
  function replaceVideoTrack(newTrack) {
    // try to get the RTCRtpSender and replace
    try {
      if (!currentCall) {
        // no active peer connection; adding track to local stream is enough
        if (localStream) {
          const s = localStream.getVideoTracks()[0];
          if (s) s.stop();
          // attach the new track to local stream
          const ms = new MediaStream([newTrack]);
          localVideo.srcObject = ms;
        }
        return;
      }
      // PeerJS keeps internal RTCPeerConnection; access via currentCall.peerConnection isn't part of official API
      // But the PeerJS call object has an _pc reference in the library — use carefully.
      const pc = currentCall.peerConnection || currentCall._pc;
      if (!pc) return;
      const senders = pc.getSenders();
      const sender = senders.find(s => s.track && s.track.kind === 'video');
      if (sender) {
        sender.replaceTrack(newTrack);
        // update local preview
        localVideo.srcObject = new MediaStream([newTrack]);
      } else {
        pc.addTrack(newTrack, new MediaStream([newTrack]));
        localVideo.srcObject = new MediaStream([newTrack]);
      }
    } catch (e) {
      log('replaceVideoTrack error', e);
    }
  }

  // ---------- Copy link ----------
  copyLinkBtn.onclick = async () => {
    const link = location.origin + location.pathname + '?room=' + encodeURIComponent(roomId) + '&role=guest';
    try {
      await navigator.clipboard.writeText(link);
      copyLinkBtn.textContent = 'Copied!';
      setTimeout(()=> copyLinkBtn.textContent = 'Copy Link', 1500);
    } catch(e) {
      alert('Copy failed: ' + e);
    }
  };

  // ---------- Leave ----------
  leaveBtn.onclick = () => {
    cleanupAndLeave();
  };

  function cleanupAndLeave() {
    try {
      if (dataConn && dataConn.open) dataConn.close();
      if (currentCall) currentCall.close();
      if (peer) peer.destroy();
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (screenStream) screenStream.getTracks().forEach(t => t.stop());
    } catch(e){ log('cleanup error', e); }
    setStatus('Left room');
    setTimeout(()=> location.href = 'index.html', 600);
  }

  // ---------- Start sequence ----------
  (async ()=> {
    try {
      setStatus('Starting…');
      await startLocalMedia();
      initPeer();
      setStatus('Ready');
    } catch(e) {
      log('start error', e);
      setStatus('Error: ' + (e.message || e));
    }
  })();

  // Cleanup on page unload
  window.addEventListener('beforeunload', () => {
    try { cleanupAndLeave(); } catch(e){}
  });

  </script>
</body>
</html>
